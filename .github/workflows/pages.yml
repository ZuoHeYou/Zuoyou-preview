name: 发布产品进度
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 构建公开白名单及核验图片
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
        run: python build.py --output "$RUNNER_TEMP/pages" --media-dir "$RUNNER_TEMP/preview-media" --repository "$PREVIEW_REPOSITORY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
